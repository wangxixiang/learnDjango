<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>添加入库明细</title>
    <style>
        .message {
            padding: 12px 16px;
            margin: 12px 0;
            border-radius: 6px;
            font-size: 16px;
        }

        .message.success {
            color: #166534;
            background-color: #dcfce7;
            border: 1px solid #86efac;
        }

        .message.warning {
            color: #854d0e;
            background-color: #fef3c7;
            border: 1px solid #fcd34d;
        }
    </style>
</head>

<body>
    {% comment %} 显示带颜色的消息 {% endcomment %}
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    <h1>添加入库明细</h1>

    <p>
        入库单号：{{ order.code }}
    </p>

    <p>
        客户：{{ order.customer.name }}
    </p>

    <form method="post">

        {% csrf_token %}

        <p>
            <label>商品：</label>

            <select name="customer_product" required>

                {% for product in customer_products %}

                <option value="{{ product.id }}">
                    {{ product.customer_sku }} - {{ product.name }}
                </option>

                {% endfor %}

            </select>
        </p>

        <p>
            <label>数量：</label>

            <input type="number" name="quantity" min="1" required>
        </p>

        <button type="submit">
            添加
        </button>

    </form>

    <p>
        <a href="{% url 'inbound_list' %}">
            返回入库单列表
        </a>
    </p>

</body>

</html>
